<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Video submissions - Somos Todxs Estrangeirxs"
    />
    <title>Videos - Somos Todxs Estrangeirxs</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../components/modals/text-modal.css" />
    <link rel="stylesheet" href="../components/carousel/carousel.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body data-page-type="video">
    <!-- Mobile Navigation Toggle Container -->
    <div id="navToggleContainer"></div>

    <div class="wrapper">
      <!-- Sidebar Navigation Container -->
      <div id="navContainer"></div>

      <!-- Main Content -->
      <main class="main-content">
        <header class="page-header">
          <h1>Videos</h1>
          <p>
            Visual stories of displacement, belonging, and the experience of
            being foreign
          </p>
        </header>

        <section>
          <div class="filter-bar">
            <button class="filter-btn active" data-sort="recent">Recent</button>
            <button class="filter-btn" data-sort="popular">Popular</button>
          </div>

          <div class="media-grid" id="mediaGrid">
            <!-- Content loaded by JavaScript -->
          </div>
        </section>

        <!-- Footer Container -->
        <div id="footerContainer"></div>
      </main>
    </div>

    <script src="../components.js"></script>
    <script src="../js/data/sample-data.js"></script>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
