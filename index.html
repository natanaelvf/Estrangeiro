<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Somos Todxs Estrangeirxs - An immersive art installation exploring the experience of being foreign"
    />
    <title>Somos Todxs Estrangeirxs | Frontpage</title>
    <!-- Use vanilla CSS -->
    <link rel="stylesheet" href="styles/frontpage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Import Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Background Multi-Toned Sections -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Subtle Background Bubbles -->
    <div id="bubbles-container"></div>

    <!-- Main Title Overlay -->
    <div class="title-overlay">
      <h1>Somos Todxs Estrangeirxs</h1>
      <p>A narrativa perpétua do extranhamento</p>
    </div>

    <!-- Controls row: toggle + pause -->
    <div class="controls-row">
      <button id="pause-btn" class="control-btn" aria-label="Pause animation">
        <i class="fa-solid fa-pause"></i>
        <span>Pause</span>
      </button>
      <a href="classic.html" class="classic-toggle">
        <i class="fa-solid fa-layer-group"></i>
        <span>Archive View</span>
      </a>
    </div>

    <!-- Interactive Canvas Area -->
    <div id="mobius-container">
      <svg
        id="mobius-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1000 600"
        preserveAspectRatio="xMidYMid meet"
      >
        <!-- The path for the convex blob shape (generated by JS) -->
        <path id="mobius-curve" fill="none" stroke="none" d="" />

        <!-- Text group — individual tspans injected by JS -->
        <g id="mobius-text-group">
          <text class="mobius-text">
            <textPath
              id="mobius-text-path"
              href="#mobius-curve"
              startOffset="0%"
            >
              Loading narratives...
            </textPath>
          </text>
        </g>
      </svg>
    </div>

    <!-- Scripts -->
    <script src="js/data/sample-data.js"></script>
    <script src="js/mobius-strip.js"></script>
  </body>
</html>
